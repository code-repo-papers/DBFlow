# SB-FLOW Configuration for MNAR (Missing Not At Random)
# 
# This is the FULL BiFlow configuration with backward bridge ENABLED.
#
# Key feature:
# - lambda_B = 0.1: Enable backward bridge for MNAR detection
#
# Rationale:
# Under MNAR, missingness depends on the missing values themselves.
# The backward bridge learns the missing mechanism, enabling:
#   1. MNAR detection via MNAR Score S
#   2. Better understanding of selection bias
#   3. Potential for mechanism-aware imputation
#
# Use this config for:
# - MNAR_logistic_T2
# - MNAR_self_pos / MNAR_self_neg
# - Any scenario where you want to detect/analyze MNAR

seed: 1024

# Data configuration
data:
  data_root: "./data"
  dataname: bean
  batch_size: 2048
  num_workers: 8
  normalize_with_train_stats: true
  clip_outliers: 0.0
  scale_factor: 1.0

# Missing mask configuration
mask:
  type: MNAR_logistic_T2          # MNAR type (or MNAR_self_pos, MNAR_self_neg)
  rate: 30
  split_idx: 0

# Model architecture
model:
  d_model: 512
  nlayers: 4
  dropout: 0.3
  mlp_mode: "macfm"             # "macfm" (recommended) or "dynamic"

# SB-FLOW specific hyperparameters - FULL BIDIRECTIONAL FOR MNAR
sbflow:
  # ========== MNAR-SPECIFIC SETTINGS ==========
  lambda_B: 0.1                   # ENABLED: Backward bridge for MNAR modeling
  lambda_cycle: 0.0               # Disabled for speed (can enable for stronger regularization)
  # ============================================
  
  # Source distribution
  source_sigma: 1.0
  
  # Optimal Transport
  # NOTE: OT coupling is SLOW (CPU-based Sinkhorn). Disable for faster training.
  ot_enabled: false              # DISABLED for speed
  ot_alpha: 0.1
  ot_reg: 0.05
  
  # Cycle consistency
  cycle_steps: 5

# Training configuration
train:
  max_epochs: 10000
  save_root: runs/SBFLOW_MNAR
  save_every: 500
  lr: 0.0001
  amp: true
  weight_decay: 0.0
  grad_clip: 1.0
  
  # Path schedule
  path_schedule: "cosine"
  time_beta: [1.0, 1.0]
  
  # MACFM-style regularization
  lambda_stab: 0.15
  lambda_cons: 0.01
  eta_cons: 0.05
  sigma_in: 0.05
  augment_target_p: 0.15
  
  # EMA
  ema:
    enabled: true
    decay: 0.999
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 500
    min_delta: 0.0001

# Imputation/Inference configuration
fm:
  steps: 50
  trials: 50
  solver: "heun"
  aggregation: "mean"
  
  # Resampling DISABLED for accurate MNAR Score
  resample:
    enabled: false
    interval: 5
    sigma: 0.6

