# SB-FLOW Configuration for Strong MNAR (Self-Mask)
# 
# This uses MNAR_self_pos: π(m_j = 1 | x) = σ(α · x_j + b), α > 0
# - Each feature's missingness depends on ITS OWN value
# - Larger values are more likely to be missing
# - Ground Truth S ≈ 2.5 (very strong selection bias!)
#
# This is consistent with synthetic experiments and provides
# clear MNAR signal for validation.

seed: 1024

# Data configuration
data:
  data_root: "./data"
  dataname: bean
  batch_size: 2048
  num_workers: 8
  normalize_with_train_stats: true

# Missing mask configuration - STRONG MNAR
mask:
  type: MNAR_self_pos              # Self-mask MNAR (strong signal!)
  rate: 30
  split_idx: 0

# Model architecture
model:
  d_model: 512
  nlayers: 3
  dropout: 0.1

# SB-FLOW specific hyperparameters
sbflow:
  # Loss weights
  lambda_B: 0.5                    # Backward bridge important for MNAR detection
  lambda_cycle: 0.1
  
  # Source distribution
  source_sigma: 1.0
  
  # Optimal Transport
  ot_alpha: 0.1
  ot_reg: 0.05
  
  # Cycle consistency
  cycle_steps: 10

# Training configuration
train:
  max_epochs: 10000
  save_root: runs/SBFLOW_STRONG_MNAR
  save_every: 500
  lr: 0.0001
  amp: true
  weight_decay: 0.0
  grad_clip: 1.0
  
  # Path schedule
  path_schedule: "linear"
  time_beta: [1.0, 1.0]
  
  # EMA
  ema:
    enabled: true
    decay: 0.999
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 500
    min_delta: 0.0001

# Imputation/Inference configuration
fm:
  steps: 50
  trials: 10
  solver: "heun"


