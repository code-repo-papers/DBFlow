# SB-FLOW Configuration for News Dataset
# Use scale_factor=2.0 to match DiffPuter's preprocessing

seed: 1024

# Data configuration
data:
  data_root: "./data"
  dataname: news
  batch_size: 2048
  num_workers: 8
  normalize_with_train_stats: true
  # DiffPuter-style preprocessing: just /2, no winsorization
  clip_outliers: 0.0           # No clipping
  scale_factor: 2.0            # Match DiffPuter's /2

# Missing mask configuration
mask:
  type: MCAR
  rate: 30
  split_idx: 0

# Model architecture
model:
  d_model: 512
  nlayers: 4
  dropout: 0.3

# SB-FLOW specific
sbflow:
  lambda_B: 0.1
  lambda_cycle: 0.0
  source_sigma: 1.0             # In scaled space, this is correct
  ot_alpha: 0.1
  ot_reg: 0.05
  cycle_steps: 5

# Training
train:
  max_epochs: 10000
  save_root: runs/SBFLOW
  save_every: 500
  lr: 0.0001
  amp: true
  weight_decay: 0.0
  grad_clip: 1.0
  path_schedule: "cosine"
  time_beta: [1.0, 1.0]
  lambda_stab: 0.15
  lambda_cons: 0.01
  eta_cons: 0.05
  sigma_in: 0.05
  augment_target_p: 0.15
  ema:
    enabled: true
    decay: 0.999
  early_stopping:
    enabled: true
    patience: 500
    min_delta: 0.0001

# Imputation
fm:
  steps: 50
  trials: 50
  solver: "heun"
  aggregation: "mean"
  resample:
    enabled: false
    interval: 5
    sigma: 0.6
